  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>

  <div class="max-w-4xl mx-auto px-5 py-8 relative z-10">
    <header class="sticky top-4 z-50 mb-10">
      <nav class="glass-nav rounded-2xl p-2 flex justify-between items-center shadow-2xl">
        <span class="text-sm font-bold tracking-wider uppercase px-4 py-2 text-cyan-400">FA.Dev</span>
        <div class="flex gap-1 text-sm font-medium">

      <div class="flex flex-col md:flex-row justify-between md:items-center gap-3 mb-6">
        <div>
          <h1 class="text-2xl font-extrabold text-white flex items-center gap-3">
            <i data-lucide="presentation" class="text-cyan-400"></i> Presentación de Capacitaciones
          </h1>
          <p class="text-xs text-slate-400 mt-1">Diseño interactivo de certificados insertado vía Canva Embed</p>

        <a href="https://www.canva.com/design/DAHWH8cFe3M/_X1Ew5ayNt6HXM2P2UoC3Q/view?utm_content=DAHWH8cFe3M&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener" class="text-xs text-cyan-400 hover:underline flex items-center gap-1">

      <div style="position: relative; width: 100%; height: 0; padding-top: 56.2500%; padding-bottom: 0; box-shadow: 0 4px 20px 0 rgba(0,0,0,0.4); margin-top: 1em; margin-bottom: 0.9em; overflow: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); will-change: transform;">
        <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0; margin: 0;"

      <div class="space-y-1 text-center md:text-left">
        <h3 class="text-base font-bold text-white flex items-center justify-center md:justify-start gap-2">
          <i data-lucide="badge-check" class="text-cyan-400"></i> Credenciales Verificadas en Credly
        </h3>
        <p class="text-xs text-slate-400">Revisa mis insignias oficiales emitidas por Cisco Networking Academy.</p>

      <a href="https://www.credly.com/users/felix-daniel-ayavaca-quezada" target="_blank" class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white font-semibold text-xs transition flex items-center gap-2 shrink-0">
